# Alembic config for the standalone catalog database.
#
# The database URL is NOT stored here — it is resolved at runtime from the
# SKYNET_CATALOG_DB_* configuration (admin/owner role) by migrations/env.py, or
# overridden with `-x url=...`. This keeps credentials out of source and makes
# the same migrations run against dev/staging/prod/Kubernetes.

[alembic]
script_location = skynet_catalogs/migrations
prepend_sys_path = .
path_separator = os

# Intentionally blank — env.py fills it in.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
