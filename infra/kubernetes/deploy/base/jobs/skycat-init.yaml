# One-time (idempotent) catalog database setup. NOT part of the base
# kustomization — apply on demand, never on ordinary app startup:
#   kubectl apply -f infra/kubernetes/deploy/base/jobs/catalog-init.yaml
#
# Runs `skynet-catalogs init` as the bootstrap/DBA role: enables PostGIS,
# creates the operational roles (owner/ingest/reader) + grants, ensures the
# schemas, hands the data objects to the ingest role, and applies Alembic
# migrations. Non-destructive; verifies the target database is `catalogs`
# (never `sky`) and fails clearly if PostGIS is unavailable.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-init
  namespace: skynet-prod
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: catalog-init
          image: ghcr.io/skynetrtn/skynet-catalogs:stable
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: skynet-shared-config
            - secretRef:
                name: skynet-runtime-secrets
          args: ["init"]
