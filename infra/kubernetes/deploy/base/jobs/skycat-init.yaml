# One-time (idempotent) catalog database setup. NOT part of the base
# kustomization — apply on demand, never on ordinary app startup:
#   kubectl apply -f infra/kubernetes/deploy/base/jobs/skycat-init.yaml
#
# Runs `skycat init` as the bootstrap/DBA role: enables PostGIS,
# creates the operational roles (owner/ingest/reader) + grants, ensures the
# schemas, hands the data objects to the ingest role, and applies Alembic
# migrations. Non-destructive; verifies the target database is `catalogs`
# (never `sky`) and fails clearly if PostGIS is unavailable.
apiVersion: batch/v1
kind: Job
metadata:
  name: skycat-init
  namespace: skycat
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: skycat-init
          image: ghcr.io/skynetrtn/skycat:stable
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: skycat-config
            - secretRef:
                name: skycat-runtime-secrets
            # Privileged catalog creds (bootstrap/admin/ingest) — Job-only.
            - secretRef:
                name: skycat-admin-secrets
          args: ["init"]
