# Catalog schema migration job (recurring schema changes). NOT part of the base
# kustomization — apply on demand after rolling a new catalog image:
#   kubectl apply -f infra/kubernetes/deploy/base/jobs/skycat-migrate.yaml
#
# Runs `skycat migrate` as the owner/migrator role (Alembic upgrade
# only). Never drops the database, never imports catalog data, verifies the
# target is `catalogs` (not a reserved PostgreSQL maintenance database), and
# fails if PostGIS is unavailable. The owner/migrator credentials come from
# SKYCAT_DB_ADMIN_USER/_PASSWORD.
apiVersion: batch/v1
kind: Job
metadata:
  name: skycat-migrate
  namespace: skycat
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: skycat-migrate
          image: ghcr.io/your-org/skycat:stable
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: skycat-config
            - secretRef:
                name: skycat-runtime-secrets
            # Privileged catalog creds (bootstrap/admin/ingest) — Job-only.
            - secretRef:
                name: skycat-admin-secrets
          args: ["migrate"]
