# Catalog schema migration job (recurring schema changes). NOT part of the base
# kustomization — apply on demand after rolling a new catalog image:
#   kubectl apply -f infra/kubernetes/deploy/base/jobs/catalog-migrate.yaml
#
# Runs `skynet-catalogs migrate` as the owner/migrator role (Alembic upgrade
# only). Never drops the database, never imports catalog data, verifies the
# target is `catalogs` (not `sky`), and fails if PostGIS is unavailable. The
# owner/migrator credentials come from SKYNET_CATALOG_DB_ADMIN_USER/_PASSWORD.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
  namespace: skynet-prod
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: catalog-migrate
          image: ghcr.io/skynetrtn/skynet-catalogs:stable
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: skynet-shared-config
            - secretRef:
                name: skynet-runtime-secrets
            # Privileged catalog creds (bootstrap/admin/ingest) — Job-only.
            - secretRef:
                name: skynet-catalog-admin-secrets
          args: ["migrate"]
