name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  skycat:
    # The deep gate: real PostgreSQL/PostGIS, because schemas, roles, COPY,
    # partitioning, and spatial queries have no meaningful non-database mode.
    name: "skycat: ruff, pyright, pytest"
    runs-on: ubuntu-latest
    services:
      catalogs:
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_USER: catalog_admin
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalogs
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U catalog_admin -d catalogs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SKYCAT_DB_BACKEND: postgresql+psycopg
      SKYCAT_DB_HOST: localhost
      SKYCAT_DB_NAME: catalogs
      SKYCAT_DB_USER: catalog_reader
      SKYCAT_DB_PASSWORD: catalog
      SKYCAT_DB_BOOTSTRAP_USER: catalog_admin
      SKYCAT_DB_BOOTSTRAP_PASSWORD: catalog
      SKYCAT_DB_ADMIN_USER: catalog_owner
      SKYCAT_DB_ADMIN_PASSWORD: catalog_owner_pw
      SKYCAT_DB_INGEST_USER: catalog_ingest
      SKYCAT_DB_INGEST_PASSWORD: catalog_ingest_pw
      SKYCAT_DB_READER_USER: catalog_reader
      SKYCAT_DB_READER_PASSWORD: catalog
    steps:
      - name: Map catalog service port
        run: echo "SKYCAT_DB_PORT=${{ job.services.catalogs.ports['5432'] }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check skycat tests

      - name: Pyright
        run: uv run pyright skycat

      - name: Initialize catalog database
        run: uv run skycat init

      - name: Test
        # --require-postgis turns "no database reachable" from a skip into a
        # hard error. Without it this job's whole reason to exist — the
        # integration tests — can vanish silently and still report green.
        run: uv run pytest tests -q --require-postgis

      - name: Deep health report
        # Diagnostics only, and only when something already failed: it names
        # which part of the contract (PostGIS, schemas, roles, migrations,
        # active releases) is missing, which a fixture connection error does
        # not. `health` exits 1 on an unhealthy target; the job has already
        # failed by this point, so that changes nothing.
        if: failure()
        run: uv run skycat health

  unit-matrix:
    # pyproject declares >=3.11,<3.14 but the deep gate only proves 3.12. The
    # unit suite needs no database, so the other versions are cheap to cover.
    name: "unit: python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Unit tests (no database)
        run: uv run --frozen pytest tests -q -m "not postgis"

  migration-graph:
    # Cheap, database-free check for the failure the PostGIS job reports late and
    # obscurely: two heads after a merge, or a revision that no longer imports.
    name: migration graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Validate the Alembic revision graph
        run: uv run pytest tests/test_migration_graph.py -q

  package-build:
    # Running from the checkout hides packaging bugs: the tests import `skycat`
    # from the source tree, where alembic.ini and the migrations are always
    # present. An installed wheel has neither guarantee.
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/pkgcheck
          uv pip install --python /tmp/pkgcheck/bin/python dist/*.whl

      - name: Smoke-test the installed package
        run: |
          /tmp/pkgcheck/bin/python -c "import skycat; print('skycat', skycat.__version__)"
          /tmp/pkgcheck/bin/skycat --help
          /tmp/pkgcheck/bin/skycat config
          /tmp/pkgcheck/bin/python - <<'PY'
          # alembic.ini lives at the repo root and is deliberately not packaged,
          # so an installed skycat must resolve script_location on its own. If
          # the migrations stop shipping in the wheel, this is where it shows up.
          from alembic.script import ScriptDirectory
          from skycat.config import CatalogDatabaseConfig
          from skycat.database.migrate import make_alembic_config

          script = ScriptDirectory.from_config(make_alembic_config(CatalogDatabaseConfig()))
          heads = script.get_heads()
          revisions = list(script.walk_revisions())
          assert len(heads) == 1, f"expected one packaged head, got {heads}"
          assert revisions, "no migrations shipped in the wheel"
          print(f"packaged migrations: {len(revisions)} revisions, head {heads[0]}")
          PY

  required:
    # The one status check branch protection should require. Internal jobs can be
    # renamed, split, or added without touching repository settings — but every
    # must-pass job has to be listed in `needs` or it stops protecting `main`.
    name: "required: ci"
    runs-on: ubuntu-latest
    if: always()
    needs: [skycat, unit-matrix, migration-graph, package-build]
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::a required CI job failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "all required CI jobs succeeded"
