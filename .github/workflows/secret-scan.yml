name: Secret scan

# This repository ships .env examples, dev database credentials, Compose assets,
# and operational docs full of connection strings. That is exactly the mix where
# a real credential blends in with the placeholders nobody looks at twice.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential that was committed and then "removed" in
          # a later commit is still published, and still needs rotating.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the working tree
        # The gitleaks Action requires an organisation licence key; the image
        # does not, and this repository belongs to an organisation.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:latest dir /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

      - name: Scan the commit history
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks:latest git /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
