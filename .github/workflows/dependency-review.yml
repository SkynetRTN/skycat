name: Dependency review

# Skycat's dependencies are all in the runtime path — the database driver, the
# ORM, the migration engine, the CLI framework. A vulnerable one is not a
# background concern, so review happens at PR time rather than after a release.
#
# Needs GitHub's dependency graph: free on public repositories, GHAS-only on
# private ones. Skycat is public, so this runs at no cost.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # High and critical block; lower severities are reported in the job
          # summary. Transitive advisories routinely land before an upstream fix
          # exists, and a hard block on those stops all merges, not just risky
          # ones.
          fail-on-severity: high
          comment-summary-in-pr: never
