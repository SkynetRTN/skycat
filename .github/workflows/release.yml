name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true
      publish_github_release:
        description: "Publish or refresh the draft GitHub Release"
        required: true
        type: boolean
        default: true
      publish_to_testpypi:
        description: "Upload the tested distributions to TestPyPI"
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: "Upload the tested distributions to PyPI"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-build:
    name: build release distributions
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release_tag.outputs.tag }}
      release-version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release_tag
        run: echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Resolve release version
        id: release_version
        run: |
          case "$RELEASE_TAG" in
            v*) echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches package version
        run: |
          uv run --python 3.12 python - <<'PY'
          from pathlib import Path
          import os
          import sys

          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              print(f"release tag {actual!r} does not match package version {version!r}", file=sys.stderr)
              print(f"expected tag: {expected}", file=sys.stderr)
              raise SystemExit(1)
          print(f"release tag {actual} matches package version {version}")
          PY
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uv run --frozen --python 3.12 --extra dev twine check --strict dist/*

      - name: Inspect distribution archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("skycat-*.whl"))
          sdist = next(Path("dist").glob("skycat-*.tar.gz"))

          wheel_names = set(zipfile.ZipFile(wheel).namelist())
          required_wheel = {
              "skycat/migrations/env.py",
              "skycat/migrations/script.py.mako",
          }
          missing = sorted(required_wheel - wheel_names)
          if not any(name.startswith("skycat/migrations/versions/") for name in wheel_names):
              missing.append("skycat/migrations/versions/*.py")
          if missing:
              raise SystemExit(f"missing wheel files: {missing}")

          with tarfile.open(sdist) as archive:
              sdist_names = {"/".join(Path(member.name).parts[1:]) for member in archive.getmembers()}
          required_sdist = {"pyproject.toml", "README.md", "docs/operations/release.md", "CHANGELOG.md"}
          missing = sorted(required_sdist - sdist_names)
          if missing:
              raise SystemExit(f"missing sdist files: {missing}")

          print(f"inspected {wheel.name} and {sdist.name}")
          PY

      - name: Install and smoke-test wheel
        run: |
          uv venv /tmp/skycat-wheel
          uv pip install --python /tmp/skycat-wheel/bin/python dist/*.whl
          /tmp/skycat-wheel/bin/python - <<'PY'
          import importlib.metadata

          import skycat
          from alembic.script import ScriptDirectory
          from skycat.config import CatalogDatabaseConfig
          from skycat.database.migrate import make_alembic_config

          assert skycat.__version__ == importlib.metadata.version("skycat")
          script = ScriptDirectory.from_config(make_alembic_config(CatalogDatabaseConfig()))
          heads = script.get_heads()
          revisions = list(script.walk_revisions())
          assert len(heads) == 1, f"expected one packaged head, got {heads}"
          assert revisions, "no migrations shipped in the wheel"
          print(f"skycat {skycat.__version__}; packaged migrations: {len(revisions)} revisions, head {heads[0]}")
          PY
          /tmp/skycat-wheel/bin/skycat --help
          /tmp/skycat-wheel/bin/skycat config

      - name: Install and smoke-test sdist
        run: |
          uv venv /tmp/skycat-sdist
          uv pip install --python /tmp/skycat-sdist/bin/python dist/*.tar.gz
          /tmp/skycat-sdist/bin/python -c "import skycat; print('skycat', skycat.__version__)"
          /tmp/skycat-sdist/bin/skycat --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error

  github-release:
    name: publish draft GitHub Release
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'push' || inputs.publish_github_release || inputs.publish_to_pypi
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish draft release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-build.outputs.release-tag }}
          name: Skycat ${{ needs.release-build.outputs.release-tag }}
          files: dist/*
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true

  testpypi-publish:
    name: publish distributions to TestPyPI
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'push' || inputs.publish_to_testpypi || inputs.publish_to_pypi
    environment:
      name: testpypi
      url: https://test.pypi.org/p/skycat
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true

  testpypi-validation:
    name: validate TestPyPI artifact and metadata
    runs-on: ubuntu-latest
    needs:
      - release-build
      - testpypi-publish
    if: github.event_name == 'push' || inputs.publish_to_testpypi || inputs.publish_to_pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-build.outputs.release-tag }}
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate TestPyPI artifact, metadata, and install
        run: python .github/scripts/validate_testpypi_release.py
        env:
          RELEASE_VERSION: ${{ needs.release-build.outputs.release-version }}
          DIST_DIR: dist

  pypi-publish:
    name: publish distributions to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build
      - github-release
      - testpypi-validation
    if: github.event_name == 'push' || inputs.publish_to_pypi
    environment:
      name: pypi
      url: https://pypi.org/p/skycat
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-build.outputs.release-tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Validate TestPyPI before PyPI upload
        run: python .github/scripts/validate_testpypi_release.py
        env:
          RELEASE_VERSION: ${{ needs.release-build.outputs.release-version }}
          DIST_DIR: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          print-hash: true
