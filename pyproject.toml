[project]
name = "skycat"
version = "0.1.4"
description = "Skycat: build and query versioned local PostgreSQL/PostGIS databases from VizieR/CDS-style astronomical reference catalogs."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "James Atkisson", email = "james@atkisson.net" },
]
maintainers = [
    { name = "SkynetRTN" },
]
keywords = [
    "astronomy",
    "catalogs",
    "photometry",
    "postgis",
    "postgresql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "sqlalchemy ~= 2.0.38",
    "geoalchemy2 ~= 0.20.0",
    "psycopg[binary] ~= 3.2.4",
    "alembic ~= 1.14",
    "click ~= 8.1",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "ruff >= 0.7.0",
    "pyright >= 1.1.380",
    "twine >= 6.0",
]

[project.scripts]
# Single entry point for every catalog operation (init, migrate, discover,
# register, import, validate, activate, query, crossmatch, health …).
skycat = "skycat.cli.main:main_entry"

[project.urls]
Homepage = "https://github.com/SkynetRTN/skycat"
Organization = "https://skynetgo.org"
Repository = "https://github.com/SkynetRTN/skycat"
Issues = "https://github.com/SkynetRTN/skycat/issues"
Documentation = "https://github.com/SkynetRTN/skycat#readme"

[tool.uv.sources]
# skycat has no in-tree path dependencies.

[tool.pytest.ini_options]
markers = [
    "postgis: integration tests that require a live PostgreSQL/PostGIS catalog database (skipped unless the SKYCAT_DB_* environment points at a reachable catalog DB).",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# pyflakes (real bugs) + the bare-except / vanilla-raise safety sweep.
select = [
    "F",       # pyflakes (unused imports/names, real bugs)
    "ARG",     # unused arguments — dead parameters outlive the code that fed them
    "BLE001",  # blind `except Exception`
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    "TRY002",  # raise vanilla Exception
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately swallow errors and may raise plain Exception.
"tests/*" = ["BLE001", "S110", "S112", "TRY002"]
# Health probes and the Alembic env are intentionally best-effort: they catch
# broadly to degrade/report rather than crash the caller.
"skycat/health.py" = ["BLE001"]
"skycat/migrations/env.py" = ["S110", "BLE001"]

[tool.pyright]
# Basic-mode type gate: catch obvious bugs without drowning in SQLAlchemy /
# GeoAlchemy generic-typing noise.
#
# Two tiers, and the split is deliberate:
#
#   error   — the null-safety family. Every one of these means "this may be
#             None here", which in this package is a real defect: an ORM row
#             that vanished, a pooled connection that was already returned. The
#             fix is `database/orm.require_row` or an explicit branch, never a
#             suppression. These were warnings until the registry/ingestion
#             sites were cleaned up; the gate is now zero, and keeping it there
#             is the point.
#
#   warning — the categories that fire on SQLAlchemy/GeoAlchemy generics
#             (`Column[str]` where a `str` is wanted, and similar). They are
#             currently at zero too, but they cannot be promoted without the
#             next model change turning generic-typing noise into a merge
#             blocker. Promote one at a time, once each has stayed quiet.
include = ["skycat"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportAttributeAccessIssue = "error"
reportOptionalMemberAccess = "error"
reportOptionalSubscript = "error"
reportOptionalOperand = "error"
reportIndexIssue = "error"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportPrivateImportUsage = "warning"

[tool.hatch.build.targets.wheel]
packages = ["skycat"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
