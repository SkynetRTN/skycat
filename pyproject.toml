[project]
name = "skycat"
version = "0.1.0"
description = "Skycat: build and query versioned local PostgreSQL/PostGIS databases from VizieR/CDS-style astronomical reference catalogs."
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [
    { name = "Skycat maintainers" },
]
dependencies = [
    "sqlalchemy ~= 2.0.38",
    "geoalchemy2 ~= 0.20.0",
    "psycopg[binary] ~= 3.2.4",
    "alembic ~= 1.14",
    "click ~= 8.1",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "ruff >= 0.7.0",
    "pyright >= 1.1.380",
]

[project.scripts]
# Single entry point for every catalog operation (init, migrate, discover,
# register, import, validate, activate, query, crossmatch, health …).
skycat = "skycat.cli.main:main_entry"

[tool.uv.sources]
# skycat has no in-tree path dependencies.

[tool.pytest.ini_options]
markers = [
    "postgis: integration tests that require a live PostgreSQL/PostGIS catalog database (skipped unless the SKYCAT_DB_* environment points at a reachable catalog DB).",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# pyflakes (real bugs) + the bare-except / vanilla-raise safety sweep.
select = [
    "F",       # pyflakes (unused imports/names, real bugs)
    "ARG",     # unused arguments — dead parameters outlive the code that fed them
    "BLE001",  # blind `except Exception`
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    "TRY002",  # raise vanilla Exception
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately swallow errors and may raise plain Exception.
"tests/*" = ["BLE001", "S110", "S112", "TRY002"]
# Health probes and the Alembic env are intentionally best-effort: they catch
# broadly to degrade/report rather than crash the caller.
"skycat/health.py" = ["BLE001"]
"skycat/migrations/env.py" = ["S110", "BLE001"]

[tool.pyright]
# Basic-mode type gate: catch obvious bugs without drowning in SQLAlchemy /
# GeoAlchemy generic-typing noise. High-volume categories are downgraded to
# warning so the gate is "no new basic-mode errors"; tighten as follow-ups land.
include = ["skycat"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportAssignmentType = "warning"
reportReturnType = "warning"
reportCallIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportIndexIssue = "warning"
reportOperatorIssue = "warning"
reportOptionalOperand = "warning"
reportPrivateImportUsage = "warning"

[tool.hatch.build.targets.wheel]
packages = ["skycat"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
